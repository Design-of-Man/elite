# Rebuilds blog posts when their SOURCE changes, and commits what the build produces.
#
# The agency portal (JARVIS content queue, Design-of-Man/ClientPortal) publishes an approved
# draft by committing one file, _posts/{slug}.json, and nothing else. This turns it into
# blog/{slug}/index.html, adds its card to /blog/, and runs seo.py for the schema graph and
# sitemap.xml. The portal watches this run's conclusion on the commit it pushed: success
# marks the draft published, failure marks it publish_failed and pages #alerts.
#
# A copy of this file lives at client-site-actions/elite-rebuild.yml in ClientPortal, with
# the README that explains the whole mechanism.
name: Rebuild site

on:
  push:
    branches: [main]
    # SOURCE ONLY. The commits this workflow pushes back touch blog/**, sitemap.xml and the
    # schema block of rendered pages, none of which match these paths — that is what stops
    # it retriggering itself. Removing this filter creates an infinite rebuild loop on a
    # live site.
    paths:
      - '_posts/**'
      - 'scripts/blog.py'

permissions:
  contents: write

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOT boilerplate. seo.py dates every page from git history; in a shallow clone it
          # falls back to a fixed date and rewrites datePublished on every page on the site.
          # See CLAUDE.md, "Never run it in a shallow clone".
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Two commits, in this order, on purpose. seo.py takes a page's datePublished from the
      # first commit that touched it, and for a file with no commits yet it falls back to a
      # fixed date — so running it before the new post page is committed would stamp a
      # brand-new article with a date weeks in the past. Committing the page first gives
      # seo.py a real date to read.
      - name: Render posts
        run: |
          set -euo pipefail
          python3 scripts/blog.py
          git add -A blog
          if git diff --cached --quiet; then
            echo "Post pages unchanged."
          else
            git commit -m "Render blog posts

          Built by scripts/blog.py from ${GITHUB_SHA}."
          fi

      - name: Schema and sitemap
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          python3 scripts/seo.py
          git add -A
          if git diff --cached --quiet; then
            echo "Schema and sitemap unchanged."
          else
            git commit -m "Update schema and sitemap

          Regenerated by scripts/seo.py after ${GITHUB_SHA}."
          fi

      - name: Push
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            # A source change that regenerates nothing is not an error. Succeed: the portal
            # reads this run's conclusion as "the post is live".
            echo "Build produced no changes."
            exit 0
          fi
          git push
